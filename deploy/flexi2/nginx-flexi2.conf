# /etc/nginx/sites-available/flexi2 on an-vm (symlinked into sites-enabled) — see deploy/flexi2/README.md.
# Cloudflare Tunnel brings flexi2.next.lc and flexi2-api.next.lc to http://localhost:80 (Host kept).
# :443 serves the same with a local CA (/opt/flexi2/certs) for the containers only: they reach
# https://flexi2.next.lc through host-gateway (docker-compose extra_hosts), as on the VPS, and trust that CA.

proxy_cache_path /var/cache/nginx/flexi2 levels=1:2 keys_zone=flexi2_files:20m max_size=10g inactive=30d use_temp_path=off;

upstream flexi2_app { server 127.0.0.1:3000; keepalive 16; }
upstream flexi2_supabase { server 127.0.0.1:8000; keepalive 16; }

# Behind the tunnel the scheme is http here, https for the visitor.
map $http_x_forwarded_proto $flexi2_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

map $http_upgrade $flexi2_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen 443 ssl;
    server_name flexi2.next.lc;
    ssl_certificate     /opt/flexi2/certs/local.crt;
    ssl_certificate_key /opt/flexi2/certs/local.key;

    client_max_body_size 500m;
    client_body_timeout 600s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $flexi2_proto;
    proxy_set_header X-Forwarded-Host $host;

    location ~ ^/(auth|rest)/v1/ {
        proxy_pass http://flexi2_supabase;
        proxy_read_timeout 120s;
    }

    location /files/ {
        proxy_pass http://flexi2_app;
        proxy_cache flexi2_files;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status always;
    }

    location /api/ {
        proxy_pass http://flexi2_app;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://flexi2_app;
        proxy_read_timeout 120s;
    }
}

# Supabase Studio (basic auth: DASHBOARD_USERNAME / DASHBOARD_PASSWORD in /opt/flexi2/supabase/.env) + APIs.
server {
    listen 80;
    listen 443 ssl;
    server_name flexi2-api.next.lc;
    ssl_certificate     /opt/flexi2/certs/local.crt;
    ssl_certificate_key /opt/flexi2/certs/local.key;

    client_max_body_size 500m;

    location / {
        proxy_pass http://flexi2_supabase;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $flexi2_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $flexi2_proto;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
