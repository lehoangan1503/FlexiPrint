# /etc/nginx/sites-available/flexiprint-studio  (symlinked into sites-enabled)
# ComfyUI studio (services/comfy) — ComfyUI has no login, so every request goes
# through auth_request: the app checks the fp_studio cookie that /studio sets
# (customize-tool/server/studio.ts). The app page embeds this host in an iframe.
#
# Host: flexiprint-studio.next.lc (needs a DNS A record → this VPS, then
#   certbot --nginx -d flexiprint-studio.next.lc), app .env:
#   CT_STUDIO_URL=https://flexiprint-studio.next.lc  CT_STUDIO_COOKIE_DOMAIN=.next.lc
# No DNS? Serve it on a port of the main domain instead (cookies ignore ports):
#   replace `listen 80` + server_name with `listen 8443 ssl;` + the flexiprint.next.lc
#   certificate lines, `ufw allow 8443/tcp`, and CT_STUDIO_URL=https://flexiprint.next.lc:8443

upstream flexiprint_comfy { server 127.0.0.1:8188; keepalive 8; }

map $http_upgrade $flexiprint_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name flexiprint-studio.next.lc;

    client_max_body_size 100m;

    location = /_studio_auth {
        internal;
        proxy_pass http://127.0.0.1:3000/api/customize-tool/studio/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host flexiprint.next.lc;
    }

    location / {
        auth_request /_studio_auth;
        error_page 401 = @login;

        proxy_pass http://flexiprint_comfy;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $flexiprint_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Only the FlexiPrint app may frame the studio.
        add_header Content-Security-Policy "frame-ancestors https://flexiprint.next.lc" always;
    }

    # Not signed in to the studio: go through the app's /studio page (sets the cookie).
    location @login {
        return 302 https://flexiprint.next.lc/studio;
    }
}
