# /etc/nginx/sites-available/flexiprint-supabase — Supabase admin (Studio) + API on its own domain,
# like supa-api.top for the 3D tool. The Envoy gateway serves Studio at / behind basic auth
# (DASHBOARD_USERNAME / DASHBOARD_PASSWORD in /opt/flexiprint/supabase/.env) and the APIs at
# /auth/v1, /rest/v1, /pg (Studio's meta). certbot --nginx adds the 443 server.
server {
    listen 80;
    listen [::]:80;
    server_name flexiprint-api.next.lc;

    client_max_body_size 500m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
