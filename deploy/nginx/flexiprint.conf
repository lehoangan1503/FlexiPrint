# /etc/nginx/sites-available/flexiprint  (symlinked into sites-enabled)
# One domain for everything:
#   /auth/v1/, /rest/v1/   → self-hosted Supabase gateway (127.0.0.1:8000)
#   /files/                → app, cached on disk (R2 objects, immutable keys)
#   everything else        → Next.js app (127.0.0.1:3000)
# certbot --nginx adds the 443 server + redirect to this file.

upstream flexiprint_app { server 127.0.0.1:3000; keepalive 16; }
upstream flexiprint_supabase { server 127.0.0.1:8000; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name flexiprint.next.lc;

    # Largest upload anywhere in the app (Next proxyClientMaxBodySize matches).
    client_max_body_size 500m;
    client_body_timeout 600s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location ~ ^/(auth|rest)/v1/ {
        proxy_pass http://flexiprint_supabase;
        proxy_read_timeout 120s;
    }

    location /files/ {
        proxy_pass http://flexiprint_app;
        proxy_cache flexiprint_files;
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache $upstream_cache_status always;
    }

    location /api/ {
        proxy_pass http://flexiprint_app;
        # Stream big uploads straight through; AI / print jobs can take minutes.
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ComfyUI studio (/comfy/, auth_request) — deploy/nginx/flexiprint-comfy.locations
    include /etc/nginx/snippets/flexiprint-comfy.locations;

    location / {
        proxy_pass http://flexiprint_app;
        proxy_read_timeout 120s;
    }
}
