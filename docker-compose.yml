# FlexiPrint production stack (Supabase runs separately: /opt/flexiprint/supabase, see deploy/README.md).
#   docker compose up -d --build
# Only the app is published, on 127.0.0.1:3000 behind host nginx (deploy/nginx/flexiprint.conf).
name: flexiprint

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_DB_SCHEMA: ${NEXT_PUBLIC_DB_SCHEMA:-flexiprint}
    image: flexiprint-app
    env_file: .env
    environment:
      CT_MATERIAL_URL: http://material-render:7003
      CT_BG_REMOVER_URL: http://bg-remover:7001
      CT_FACE_DETECT_URL: http://face-detect:7004
      # v2 bộ nhân vật: layer sets cut from one master (services/layer-kit).
      CT_LAYER_KIT_URL: http://layer-kit:7005
    # Server-side Supabase calls go to the public URL; resolve it to the host's nginx
    # directly instead of hair-pinning through the public IP.
    extra_hosts:
      - "${APP_DOMAIN:-flexiprint.next.lc}:host-gateway"
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    depends_on: [material-render, face-detect, layer-kit]

  face-detect:
    build: ./services/face-detect
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "7004", "--workers", "2"]

  # v2 bộ nhân vật — cuts pixel-registered layer sets from one AI master + its in-place edits (OpenCV, no model;
  # matting goes to bg-remover). One build at a time, a few GB of RAM while it runs.
  layer-kit:
    build: ./services/layer-kit
    restart: unless-stopped
    environment:
      BG_REMOVER_URL: http://bg-remover:7001
    # It downloads the project's files from the app's public /files/ URLs: resolve the domain to the host's nginx.
    extra_hosts:
      - "${APP_DOMAIN:-flexiprint.next.lc}:host-gateway"
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "7005", "--workers", "1"]

  material-render:
    build: ./services/material-render
    restart: unless-stopped
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "7003", "--workers", "1"]

  # BiRefNet cut-out (~1 GB model). The VPS leans on swap for it — slow but free;
  # set FAL_KEY and stop this service to use fal.ai instead.
  bg-remover:
    build: ./services/bg-remover
    restart: unless-stopped
    environment:
      BG_MODEL: birefnet-general
      BG_CONCURRENCY: "1"
      BG_MAX_SIDE: "1600"
    deploy:
      resources:
        limits:
          memory: 3g
